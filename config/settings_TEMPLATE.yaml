# Copy this file to settings.yaml and fill in real values.
# settings.yaml is in .gitignore so your passwords never get committed to GitHub.

database:
  path: "data/meter_readings.db"

# Used by poll_meter.py (scheduled collection) to talk to a meter
# directly over Modbus TCP.
meter:
  converter_ip: "192.168.1.63"   # the converter's IP once it's on your building WiFi
  modbus_tcp_port: 8899          # Waveshare's "Network A" TCP server port — check the converter's
                                  # own "Network A Setting" page (under Application Setting) for the
                                  # actual port; 8899 is the converter's own default, not 502.
  modbus_address: 1              # the meter's own Modbus slave address (PM2230 default: 1)
  unit_id: "unit1"                # label stored alongside each reading, to tell multiple meters apart

# Used by cloud_sync.py to push new readings from the local SQLite database
# up to a hosted Postgres database (e.g. a free Supabase or Neon project).
cloud:
  database_url: "postgresql://user:password@host:5432/dbname?sslmode=require"
