# Copy this file to settings.yaml and fill in real values.
# settings.yaml is in .gitignore so your passwords never get committed to GitHub.

database:
  path: "data/meter_readings.db"

# Used by poll_meter.py (scheduled collection) to talk to each meter
# directly over Modbus TCP. One entry per meter. modbus_tcp_port and
# modbus_address are optional per entry — default to 8899 and 1, the
# Waveshare and PM2230 factory defaults (check a converter's own "Network A
# Setting" page if it was reconfigured to something else).
#
# converter_id identifies the physical Waveshare converter (multiple meters
# can share one converter_id if they're wired to the same converter at
# different modbus_address values). meter_id identifies the individual
# meter and must be unique across the whole list — it's what the dashboard
# groups readings by.
meters:
  - converter_id: "floor1"
    converter_ip: "192.168.1.60"
    meter_id: "floor1_meter1"

  - converter_id: "floor1"
    converter_ip: "192.168.1.60"
    meter_id: "floor1_meter1"
    modbus_address: 2 
  # - converter_id: "floor2"
  #   converter_ip: "192.168.1.xx"   # floor 2's converter IP
  #   meter_id: "floor2_meter1"
  # - converter_id: "floor3"
  #   converter_ip: "192.168.1.xx"   # floor 3's converter IP
  #   meter_id: "floor3_meter1"
  # - converter_id: "floor4"
  #   converter_ip: "192.168.1.xx"   # floor 4's converter IP
  #   meter_id: "floor4_meter1"
  # - converter_id: "floor5"
  #   converter_ip: "192.168.1.xx"   # floor 5's converter IP
  #   meter_id: "floor5_meter1"

# Used by cloud_sync.py to push new readings from the local SQLite database
